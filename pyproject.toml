[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance with NASA C-MAPSS"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "scikit-learn",
    "matplotlib",
    "joblib>=1.6.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_maintenance"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

